# Fly.io config — glink-booking admin-api (FastAPI control plane for the agency UI).
# Deploy from the MONOREPO ROOT:
#   fly deploy --config apps/admin-api/fly.toml
# (The Dockerfile COPYs packages/shared and packages/provisioning, so the
# build context MUST be the monorepo root, not apps/admin-api/.)
#
# Persistent volume `admin_data` is mounted at /app/.data so per-client records
# survive deploys. Lose this volume and you lose every first-login password
# (the bookings@glnkco.com user still exists, the password just isn't recoverable from disk).
# Seed the volume after first deploy — see apps/ops/RUNBOOK.md ("Deploying to Fly").
#
# Secrets to set before first deploy (via `fly secrets set --app glnk-admin-api`):
#   ADMIN_SESSION_SECRET   — `openssl rand -hex 32`
#
# Non-secret env lives below.

app = "glnk-admin-api"
primary_region = "iad"

[build]
  # `dockerfile` is resolved relative to this fly.toml's directory.
  # The BUILD CONTEXT must still be the monorepo root (the Dockerfile COPYs
  # packages/*), which we pass explicitly as the trailing argument to
  # `fly deploy`. See bin/deploy-fly.sh.
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  CAL_WEB_BASE = "https://glnk-booking.fly.dev"
  CAL_PUBLIC_BASE = "https://glnk-booking.fly.dev"
  ADMIN_UI_ORIGIN = "https://glnk-admin-ui.fly.dev"
  ADMIN_COOKIE_SECURE = "true"
  ADMIN_SESSION_TTL_SECONDS = "86400"
  STORE_DIR = "/app/.data"

[http_service]
  internal_port = 8002
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "20s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "admin_data"
  destination = "/app/.data"
