[project]
name = "admin-api"
version = "0.1.0"
description = "FastAPI admin-side API. Backs the admin-ui; reuses cal-client + provisioning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.18",
    "email-validator>=2.0",
    "cal-client",
    "provisioning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_api"]
