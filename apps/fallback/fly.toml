# Fly.io config — glink-booking fallback (static outage page).
# Deploy from this directory: `flyctl deploy`.
#
# The static site is built locally first (it reads ../../.data/clients.json,
# which is gitignored AND excluded from the docker context for safety). The
# deploy script (bin/deploy-fly.sh) handles `npm run build` before fly deploy.
#
# This app's whole reason to exist is being up when nothing else is. Keep at
# least 1 machine running so an outage of bookings@glnkco.com doesn't also produce
# a cold start on the fallback.

app = "glnk-fallback"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  # No auto_stop — the whole point of the fallback is to be up during an
  # outage. A 5-second cold start when bookings@glnkco.com is dead is bad UX.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
