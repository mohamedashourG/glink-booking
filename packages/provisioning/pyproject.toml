[project]
name = "provisioning"
version = "0.1.0"
description = "Client provisioning CLI for the glink-booking system."
requires-python = ">=3.11"
dependencies = [
    "cal-client",
]

[project.scripts]
glink-provision = "provisioning.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioning"]
