[project]
name = "cal-client"
version = "0.1.0"
description = "Shared bookings@glnkco.com client + config for glink-booking."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cal_client"]
